schema_version: 1

context:
  version: 2.271.0

package:
  name: aws-cdk.cx-api
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/aws-cdk.cx-api/aws_cdk_cx_api-${{ version }}.tar.gz
  sha256: 48a640339530cfd7a3490d9f8542fa3d510aa812e5843e43930483caa4832520

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=75.3.2
    - python-build >=1.5.0,<1.6.dev0
    - pip
  run:
    - python >=${{ python_min }}
    - aws-cdk.cloud-assembly-schema >=54.24.0
    - python-jsii >=1.140.0,<2.0.0
    - publication >=0.0.3
tests:
  - python:
      imports:
        - aws_cdk.cx_api
        - aws_cdk.cx_api._jsii
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Cloud executable protocol
  license: MIT AND Apache-2.0
  license_file:
    - NOTICE
    - LICENSE
  homepage: https://github.com/aws/aws-cdk
  repository: https://github.com/aws/aws-cdk.git

extra:
  recipe-maintainers:
    - ocefpaf
